    <!-- Tailwind CSS is now bundled via npm - no CDN needed -->
    
    <!-- Font Awesome - Defer loading to avoid blocking -->
    <script>
      window.loadFontAwesome = function() {
        if (!document.getElementById('fontawesome-css')) {
          var link = document.createElement('link');
          link.id = 'fontawesome-css';
          link.rel = 'stylesheet';
          link.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css';
          link.media = 'print';
          link.onload = function() { 
            this.media = 'all';
            window.dispatchEvent(new Event('fontawesome-loaded'));
          };
          document.head.appendChild(link);
        }
      };
      // Defer Font Awesome loading - load after page is interactive
      if (document.readyState === 'complete') {
        setTimeout(window.loadFontAwesome, 1000);
      } else {
        window.addEventListener('load', function() {
          setTimeout(window.loadFontAwesome, 1000);
        }, { once: true });
      }
    </script>
    
    <!-- Custom CSS - Load asynchronously after critical render -->
    <script>
      window.loadCustomCSS = function() {
        ['templatemo-space-dynamic.css', 'animated.css'].forEach(function(css) {
          if (!document.getElementById('custom-' + css)) {
            var link = document.createElement('link');
            link.id = 'custom-' + css;
            link.rel = 'stylesheet';
            link.href = '%PUBLIC_URL%/assets/css/' + css;
            link.media = 'print';
            link.onload = function() { this.media = 'all'; };
            document.head.appendChild(link);
          }
        });
      };
      // Load after page is interactive
      if (document.readyState === 'complete') {
        setTimeout(window.loadCustomCSS, 500);
      } else {
        window.addEventListener('load', function() {
          setTimeout(window.loadCustomCSS, 500);
        });
      }
    </script>
    
    <!-- Three.js Library - Load only when explicitly needed (deferred) -->
    <script>
      window.loadThreeJS = function() {
        if (!window.THREE && !document.getElementById('three-js')) {
          var script = document.createElement('script');
          script.id = 'three-js';
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
          script.async = true;
          script.defer = true;
          document.head.appendChild(script);
        }
      };
    </script>
